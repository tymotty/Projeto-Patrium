<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="/frontend/src/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrium</title>
</head>
<body>
<!---------------------------------------------------------------------------------->
<!-------------------------------------NAV------------------------------------------>
<!---------------------------------------------------------------------------------->

    <nav>
        <h1 id="title">Patrium</h1>
        <p id="subtitle">Gerenciamento de Patrimônio</p>
        <ul>
            <li><a href="#visao-geral">Visão Geral</a></li>
            <li><a href="#lucro">Lucro</a></li>
            <li><a href="#poupanca">Poupança</a></li>
        </ul>
        <button type="button" id="adicionar-gasto">
            + Adicionar Gasto
        </button>

        <ul>
            <li><a href="#conta">Conta</a></li>
        </ul>
    </nav>

<!---------------------------------------------------------------------------------->
<!-----------------------------------DASHBOARD-------------------------------------->
<!---------------------------------------------------------------------------------->
    <main id="dashboard-grid">


        <article  class="widget card" id="card-patrimonio">
            <p class="card-title">PATRIMÔNIO TOTAL</p>
            <h2 class="card-value">R$ 148.320</h2>
            <p class="card-description"> ▲ 3,4% este mês</p>
        </article>


        <article  class="widget card" id="card-lucro">
            <p class="card-title">Lucro ACUMULADO</p>
            <h2 class="card-value">R$ 21.840</h2>
            <p class="card-description"> ▲ 12,8% no ano</p>
        </article>


        <article  class="widget card" id="card-poupanca">
            <p class="card-title">TOTAL GUARDADO</p>
            <h2 class="card-value">R$ 52.000</h2>
            <p class="card-description">Meta anual: R$ 60.000</p>
        </article>


        <article  class="widget card" id="card-gastos">
            <p class="card-title">GASTOS DO MÊS</p>
            <h2 class="card-value">R$ 3.200</h2>
            <p class="card-description">Média de gastos mensal: R$ 4.000</p>
        </article>

        <article class="widget grafico" id="grafico-despesas">
            <canvas id="grafico-despesas"></canvas>
            <!-- Gráfico de despesas -->
        </article>

        <article class="widget grafico" id="grafico-alocacao">
            <canvas id="grafico-alocacao"></canvas>  
            <!-- Gráfico de alocação de investimentos -->
        </article>
        
        <article class="widget table" id="tabela-acoes">
            <table>
                <!-- Tabela de acoes -->
            </table>
        </article>

    </main>
</body>
